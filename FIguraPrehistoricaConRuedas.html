<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figurilla Prehispánica con Ruedas</title>
    <style>
        body {
            background-color: #FAF3E0; /* Fondo crema muy suave */
            font-family: 'Georgia', serif;
            color: #333333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .contenedor-principal {
            max-width: 850px;
            background-color: #FFFFFF;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #5D4037;
            font-family: 'Arial Black', sans-serif;
            font-size: 2.2em; /* Ligeramente más pequeño para ajustar títulos largos */
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 1.5px;
            border-bottom: 3px solid #8D6E63;
            padding-bottom: 15px;
        }

        figure {
            margin: 0;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(93, 64, 55, 0.2);
            border: 5px solid #EFEBE9;
            object-fit: cover;
            flex-shrink: 0;
        }

        figcaption {
            flex-grow: 1;
        }

        .seccion-detalles {
            margin-bottom: 20px;
            padding: 15px;
            border-left: 5px solid #8D6E63;
            background-color: #F8F8F8;
            border-radius: 4px;
        }

        h3 {
            color: #8D6E63;
            font-size: 1.2em;
            margin-top: 0;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .texto-intro {
            font-size: 1em;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #4a4a4a;
            font-style: italic;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 8px;
            line-height: 1.4;
        }

        li strong {
            color: #5D4037;
            font-weight: bold;
            display: inline-block;
            min-width: 110px;
        }

        .enlace-fuente {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px dashed #CCCCCC;
            font-size: 0.9em;
        }

        .enlace-fuente strong {
            display: block;
            margin-bottom: 5px;
            color: #5D4037;
        }

        .enlace-fuente a {
            color: #00796B;
            text-decoration: none;
            word-break: break-all;
        }

        .enlace-fuente a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .contenedor-principal {
                padding: 15px;
                margin: 0 10px;
            }
            figure {
                flex-direction: column;
                gap: 20px;
            }
            img {
                width: 100%;
                height: auto;
            }
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1>Figurilla Prehispánica con Ruedas</h1>
        <figure>
            <img
                src="imagenes/paginas/figuraPrehistoricaConRuedas.jpg"
                alt="Figurilla zoomorfa con ruedas"
                width="350"
                height="350"
            />
            <figcaption>
                
                <div class="seccion-detalles">
                    <h3>Descripción General</h3>
                    <p class="texto-intro">
                        Esta intrigante pieza de cerámica es una efigie animal, comúnmente identificada como un jaguar o un perro. Su importancia arqueológica radica en que demuestra el conocimiento del concepto de la rueda en las culturas mesoamericanas, a pesar de no haber sido utilizada para el transporte a gran escala. A menudo se debate si su función era la de un juguete o un objeto ritual vinculado al inframundo.
                    </p>
                </div>

                <div class="seccion-detalles">
                    <h3>Características</h3>
                    <ul>
                        <li><strong>Tipo</strong>: Figurilla Zoomorfa (Animal)</li>
                        <li><strong>Material</strong>: Cerámica</li>
                        <li><strong>Rasgo Clave</strong>: Sistema de ruedas funcionales</li>
                        <li><strong>Posibles animales</strong>: Jaguar o Perro</li>
                    </ul>
                </div>

                <div class="seccion-detalles">
                    <h3>Contexto Cultural</h3>
                    <ul>
                        <li><strong>Región</strong>: Centro de Veracruz (Culturas del Golfo)</li>
                        <li><strong>Hallazgo</strong>: Frecuente en ofrendas y entierros</li>
                        <li><strong>Significado</strong>: Simbólico / Ritual o Lúdico (Juguete)</li>
                        <li><strong>Ubicación actual</strong>: Museo de Antropología de Xalapa</li>
                    </ul>
                </div>

                <div class="enlace-fuente">
                    <strong>Fuente oficial:</strong>
                    <a
                        href="https://sapp.uv.mx/catalogomax/es-MX/sala/detalles/1225"
                        target="_blank"
                        >https://sapp.uv.mx/catalogomax/es-MX/sala/detalles/1225</a
                    >
                </div>
            </figcaption>
        </figure>
    </div>
</body>
</html>
