<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>XalapAR - Museo de Antropología</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body style="margin: 0; padding: 0">
        <main>
            <div class="overlay"></div>

            <div class="contenido">
                <h1 class="titulo">XALAPAR</h1>
                <h2 class="subtitulo">Museo de Antropología de Xalapa</h2>
                <p class="detalles">INTERFACES DE USUARIO AVANZADAS</p>

                <button class="boton-entrar" onclick="camara()">
                    Entrar a la Experiencia
                </button>
            </div>
        </main>

        <script>
            function camara() {
                window.location.href = "camara.html";
            }
        </script>

        <style>
            body {
                font-family: sans-serif;
            }

            main {
                background-image: url("imagenes/xalapa-landing.jpg");
                background-size: cover;
                background-position: center;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }

            .overlay {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: rgba(0, 0, 0, 0.6);
            }

            .contenido {
                position: relative;
                z-index: 2;
                text-align: center;
                color: white;
                padding: 20px;
            }

            .titulo {
                font-family: "Cinzel", serif;
                font-size: 80px;
                margin: 0;
                letter-spacing: 5px;
            }

            .subtitulo {
                font-weight: 300;
                font-size: 24px;
                margin-top: 10px;
                opacity: 0.9;
            }

            .detalles {
                font-size: 12px;
                letter-spacing: 3px;
                text-transform: uppercase;
                margin-bottom: 50px;
                opacity: 0.7;
            }

            .boton-entrar {
                cursor: pointer;
                background-color: transparent;
                color: white;
                border: 2px solid white;
                padding: 15px 40px;
                font-size: 18px;
                text-transform: uppercase;
                letter-spacing: 2px;
                transition: all 0.3s ease;
            }

            .boton-entrar:hover {
                background-color: white;
                color: black;
            }

            @media (max-width: 600px) {
                .titulo {
                    font-size: 50px;
                }
                .subtitulo {
                    font-size: 18px;
                }
            }
        </style>
    </body>
</html>
