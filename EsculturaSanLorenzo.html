<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabeza Colosal No. 3 - San Lorenzo</title>
    <style>
        body {
            background-color: #FAF3E0; /* Fondo crema muy suave */
            font-family: 'Georgia', serif;
            color: #333333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .contenedor-principal {
            max-width: 850px;
            background-color: #FFFFFF;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #5D4037;
            font-family: 'Arial Black', sans-serif;
            font-size: 2.5em;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 1.5px;
            border-bottom: 3px solid #8D6E63;
            padding-bottom: 15px;
        }

        figure {
            margin: 0;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(93, 64, 55, 0.2);
            border: 5px solid #EFEBE9;
            object-fit: cover;
            flex-shrink: 0;
        }

        figcaption {
            flex-grow: 1;
        }

        .seccion-detalles {
            margin-bottom: 20px;
            padding: 15px;
            border-left: 5px solid #8D6E63;
            background-color: #F8F8F8;
            border-radius: 4px;
        }

        h3 {
            color: #8D6E63;
            font-size: 1.2em;
            margin-top: 0;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Estilo para el texto introductorio */
        .texto-intro {
            font-size: 1em;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #4a4a4a;
            font-style: italic;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 8px;
            line-height: 1.4;
        }

        li strong {
            color: #5D4037;
            font-weight: bold;
            display: inline-block;
            min-width: 110px; /* Ajustado un poco para etiquetas más largas */
        }

        .enlace-fuente {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px dashed #CCCCCC;
            font-size: 0.9em;
        }

        .enlace-fuente strong {
            display: block;
            margin-bottom: 5px;
            color: #5D4037;
        }

        .enlace-fuente a {
            color: #00796B;
            text-decoration: none;
            word-break: break-all;
        }

        .enlace-fuente a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .contenedor-principal {
                padding: 15px;
                margin: 0 10px;
            }
            figure {
                flex-direction: column;
                gap: 20px;
            }
            img {
                width: 100%;
                height: auto;
            }
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1>Cabeza Colosal No. 3 (San Lorenzo)</h1>
        <figure>
            <img
                src="imagenes/paginas/escultura_san_lorenzo.jpg"
                alt="Cabeza Colosal Olmeca No. 3"
                width="350"
                height="350"
            />
            <figcaption>
                
                <div class="seccion-detalles">
                    <h3>Descripción General</h3>
                    <p class="texto-intro">
                        Conocida también como el Monumento 3 de San Lorenzo, esta imponente escultura es una de las cabezas colosales más antiguas jamás encontradas. Resguardada en el Museo de Antropología de Xalapa, esta obra maestra del arte olmeca destaca por su realismo y monumentalidad, representando el poder de los antiguos gobernantes a través de la piedra volcánica.
                    </p>
                </div>

                <div class="seccion-detalles">
                    <h3>Ficha Técnica</h3>
                    <ul>
                        <li><strong>Material</strong>: Basalto</li>
                        <li><strong>Peso</strong>: 9.4 toneladas (aprox.)</li>
                        <li><strong>Altura</strong>: 1.78 metros</li>
                        <li><strong>Ancho</strong>: 1.63 metros</li>
                        <li><strong>Profundidad</strong>: 0.95 metros</li>
                    </ul>
                </div>

                <div class="seccion-detalles">
                    <h3>Contexto Histórico</h3>
                    <ul>
                        <li><strong>Cultura</strong>: Olmeca</li>
                        <li><strong>Sitio</strong>: San Lorenzo Tenochtitlán</li>
                        <li><strong>Antigüedad</strong>: 1200 a 900 a.C. (Preclásico)</li>
                        <li><strong>Simbolismo</strong>: Retrato de un gobernante con tocado tipo casco.</li>
                    </ul>
                </div>

                <div class="enlace-fuente">
                    <strong>Fuente oficial:</strong>
                    <a
                        href="https://sapp.uv.mx/catalogomax/es-MX/sala/detalles/19"
                        target="_blank"
                        >https://sapp.uv.mx/catalogomax/es-MX/sala/detalles/19</a
                    >
                </div>
            </figcaption>
        </figure>
    </div>
</body>
</html>
